name: release

on:
  push:
    tags:
      - "release*"

  workflow_dispatch:

permissions:
  contents: read

jobs:
   qemu-riscv64-cheri-minimal-multilib:
      runs-on: the-capable-hub-aws-ci
      env:
         RELEASE_DIR: ${{github.workspace}}/volatile/${{ github.job }}/release
         BUILD_DIR: ${{github.workspace}}/volatile/${{ github.job }}
      container:
        image: capablehub/cheri-yocto:latest

      steps:
         - name:
           if: github.ref == 'refs/heads/codasip-scarthgap'
           run: |
              sudo mkdir -p ${{env.BUILD_DIR}}
              echo HOME=/home/ci | sudo tee -a $GITHUB_ENV
              sudo ln -sf /home/ci ${{env.BUILD_DIR}}

         - name: Checkout layers
           uses: actions/checkout@v4
           with:
              path: ${{env.BUILD_DIR}}

         - name: Build kas
           run: |
            cd $BUILD_DIR
            kas build kas/qemu-riscv64-cheri-minimal-multilib.yml

         - name: Upload build logs on failure
           if: failure()
           uses: actions/upload-artifact@v4
           with:
             name: failure-logs
             path: |
               ${{env.BUILD_DIR}}/build/tmp*/work*/**/temp/*.do_*.*

         - name: Stage for upload
           run: |
              mkdir -p "$RELEASE_DIR"

              cp -L $BUILD_DIR/build/tmp-musl/deploy/images/qemuriscv64cheri/core-image-minimal-qemuriscv64cheri.rootfs.ext4 "$RELEASE_DIR"

              cp -L $BUILD_DIR/build/tmp-musl/deploy/images/qemuriscv64cheri/fw_dynamic.bin "$RELEASE_DIR"

              cp -L $BUILD_DIR/build/tmp-musl/deploy/images/qemuriscv64cheri/Image "$RELEASE_DIR"

         - name: Upload release
           env:
             AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
             AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
             AWS_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
             AWS_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
           run: |
              aws s3 sync "$RELEASE_DIR" "s3://$AWS_BUCKET_NAME/${{ github.ref_name }}" --endpoint-url $AWS_ENDPOINT --region auto
